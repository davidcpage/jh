[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jh"
version = "0.1.0"
description = "gh issue for a local JSONL log: a small issue tracker with a gh-compatible CLI, a board and a docs viewer."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "David Page" }]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
jh = "jh.jh_cli:main"
jh-server = "jh.jh_server:main"

[project.urls]
Homepage = "https://github.com/davidcpage/jh"

[tool.setuptools]
packages = ["jh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
